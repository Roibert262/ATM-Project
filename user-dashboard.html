<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>User Dashboard - The Real Bank</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Butoane navigare stanga sus -->
    <nav class="top-nav">
        <button onclick="history.back()" class="btn-nav">← BACK</button>
        <a href="index.html" class="btn-nav">HOME</a>
    </nav>

    <header class="header">
        <h1 class="main-title">The Real Bank-ATM</h1>
        <p class="subtitle">Welcome to “The Real Bank”, a place where all your money and stress can be handled with trust</p>
    </header>

    <main class="login-container">
        <h2 class="form-title">WELCOME, <span id="user-display-name">USER</span>!</h2>
        <p style="font-size: 24px; margin-bottom: 50px;">Current Balance: <strong>$<span id="user-balance">0</span></strong></p>
        
        <div class="options-container" style="max-width: 700px; width: 100%; position: relative; z-index: 10;">
            <button type="button" id="btn-deposit" class="btn-option" style="background: none; border: none; cursor: pointer;">DEPOSIT</button>
            <button type="button" id="btn-withdraw" class="btn-option" style="background: none; border: none; cursor: pointer;">WITHDRAW</button>
        </div>
    </main>

    <footer class="footer">
        Created by Robert, August 2026
    </footer>

    <script>
        function loadCurrentUser() {
            const currentUser = JSON.parse(localStorage.getItem('current_user'));
            if (!currentUser) {
                window.location.replace('user-login.html');
                return;
            }

            document.getElementById('user-display-name').textContent = currentUser.name.toUpperCase();
            document.getElementById('user-balance').textContent = currentUser.balance || 0;
        }

        // Se executa la fiecare afisare, inclusiv navigare Back/Forward
        window.addEventListener('pageshow', loadCurrentUser);

        document.addEventListener('DOMContentLoaded', () => {
            const depositBtn = document.getElementById('btn-deposit');
            if (depositBtn) {
                depositBtn.addEventListener('click', () => {
                    window.location.href = 'user-deposit.html';
                });
            }

            const withdrawBtn = document.getElementById('btn-withdraw');
            if (withdrawBtn) {
                withdrawBtn.addEventListener('click', () => {
                    window.location.href = 'user-withdraw.html';
                });
            }
        });
    </script>
</body>
</html>
